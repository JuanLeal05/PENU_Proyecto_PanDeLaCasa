<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pan de la Casa · Seguimiento de tu pedido</title>
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/css/styles.css" />
    <script src="/config.js"></script>
    <script type="module" src="/js/order.js"></script>
  </head>
  <body class="pagina-pedido">
    <a class="saltar" href="#contenido">Saltar al contenido</a>

    <header class="encabezado">
      <div class="encabezado__interior">
        <a class="marca" href="/index.html" aria-label="Pan de la Casa, inicio">
          <span class="marca__sello" aria-hidden="true">PC</span>
          <span class="marca__nombre">Pan de la Casa</span>
        </a>
        <a class="enlace-volver" href="/index.html"><span aria-hidden="true">‹</span> Volver al catálogo</a>
      </div>
    </header>

    <main id="contenido" class="contenido">
      <header class="seccion-titulo">
        <p class="seccion-titulo__antetitulo">Seguimiento en vivo</p>
        <h1>Tu pedido</h1>
      </header>

      <section class="tarjeta pedido" aria-labelledby="pedido-titulo">
        <h2 id="pedido-titulo" class="visualmente-oculto">Tu pedido</h2>
        <p id="mensaje-pedido" class="aviso" role="status" aria-live="polite" hidden></p>
        <div id="pedido" aria-live="polite">
          <p class="cargando">Consultando tu pedido…</p>
        </div>
        <div class="pedido__acciones">
          <button id="actualizar" class="boton boton--secundario" type="button">Actualizar ahora</button>
          <button id="cancelar" class="boton boton--peligro" type="button" hidden>Cancelar pedido</button>
        </div>
        <p id="ultima-actualizacion" class="pedido__nota"></p>
      </section>
    </main>

    <footer class="pie">
      <div class="pie__interior">
        <span class="marca">
          <span class="marca__sello" aria-hidden="true">PC</span>
          <span class="marca__nombre">Pan de la Casa</span>
        </span>
        <p>Bogotá · Pago en tienda al recoger.</p>
      </div>
    </footer>
  </body>
</html>
