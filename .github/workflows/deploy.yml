name: Deploy

on:
  push:
    branches: [develop, main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Si fallan las pruebas o el análisis estático, no se despliega nada.
  quality:
    uses: ./.github/workflows/ci.yml

  dev:
    if: github.ref_name == 'develop'
    needs: quality
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: dev
      ref: ${{ github.sha }}

  prod:
    if: github.ref_name == 'main'
    needs: quality
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: prod # se detiene por la aprobación manual del environment prod
      ref: ${{ github.sha }}
