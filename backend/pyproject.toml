[project]
name = "pan-de-la-casa-backend"
version = "0.1.0"
description = "Lambdas de Pan de la Casa (Python 3.12, solo stdlib + boto3 en src/)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"] # assert en tests

[tool.ruff.lint.per-file-ignores]
# Valores ficticios de prueba (claves de moto, códigos de pedido) no son secretos reales.
"tests/**" = ["S105", "S106"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=70"

[tool.coverage.run]
branch = true
source = ["app"]
